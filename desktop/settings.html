<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Agent Token Meter · 设置</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --yellow:#d29922; --red:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; padding:18px 22px; }
  h1 { font-size:17px; margin:0 0 12px; }
  h2 { font-size:13px; color:var(--dim); font-weight:500; margin:18px 0 8px; text-transform:uppercase; letter-spacing:.04em; }
  .prov { display:grid; grid-template-columns:auto 1fr auto; gap:4px 10px; align-items:center; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin-bottom:6px; }
  .prov .s { font-size:12px; color:var(--dim); text-align:right; }
  .prov .s.active { color:var(--green); } .prov .s.connected { color:var(--accent); } .prov .s.error, .prov .s.needs-key { color:var(--red); } .prov .s.installed { color:var(--yellow); }
  .prov .d { grid-column:2 / -1; font-size:11px; color:var(--dim); word-break:break-all; }
  label.f { display:block; margin:8px 0 3px; color:var(--dim); font-size:12px; }
  input[type=text], input[type=password], input[type=number] { width:100%; background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:13px; }
  .row { display:flex; gap:8px; align-items:center; margin-top:14px; }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:6px 14px; cursor:pointer; font-size:13px; }
  button.primary { background:#238636; border-color:#2ea043; }
  .hint { color:var(--dim); font-size:12px; }
  .ok { color:var(--green); } .err { color:var(--red); }
</style>
</head>
<body>
<h1>设置</h1>
<h2>数据来源（自动识别）</h2>
<div id="providers"></div>
<h2>Devin 云端</h2>
<div class="hint">用 Devin API 读取云端会话的 ACU 消耗：在 app.devin.ai → Settings → Devin API → Service users 创建一个密钥（cog_ 开头）。密钥用系统钥匙串加密保存在本机，只发给 api.devin.ai。</div>
<label class="f" for="key">API 密钥 <span id="keyState" class="hint"></span></label>
<input id="key" type="password" placeholder="cog_…" autocomplete="off" />
<label class="f" for="org">组织 ID（可选，企业密钥需要）</label>
<input id="org" type="text" placeholder="org-…" />
<label class="f" for="base">API 地址（可选，专属部署用）</label>
<input id="base" type="text" placeholder="https://api.devin.ai" />
<h2>通用</h2>
<label class="f" for="since">载入最近多少小时的会话</label>
<input id="since" type="number" min="1" />
<div class="row"><button class="primary" id="save">保存</button><button id="clearKey">删除 Devin 密钥</button><span id="msg" class="hint"></span></div>
<p class="hint" id="info"></p>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const STATE = { active:'活跃', connected:'已连接', installed:'已安装 · 无数据', 'not-found':'未发现', 'needs-key':'需要 API 密钥', error:'错误', connecting:'连接中', detecting:'检测中' };
let settings;
function renderProviders(status) {
  const byId = Object.fromEntries((status || []).map((p) => [p.id, p]));
  const boxes = [...document.querySelectorAll('#providers input[type=checkbox]')];
  if (boxes.length) settings.providers = boxes.filter((c) => c.checked).map((c) => c.dataset.id);
  $('providers').innerHTML = settings.all.map((p) => {
    const st = byId[p.id];
    const on = settings.providers.includes(p.id);
    const detail = st ? [st.detail, ...(st.running || []).map((r) => '运行中: ' + r), ...(st.roots || []), ...(st.bins || [])].filter(Boolean).join(' · ') : '未启用';
    return `<div class="prov"><input type="checkbox" data-id="${esc(p.id)}" ${on ? 'checked' : ''} /><b>${esc(p.name)} <span class="hint">${esc(p.surfaces)}</span></b>
      <span class="s ${st ? esc(st.state) : ''}">${st ? esc(STATE[st.state] || st.state) + (st.sessions ? ` · ${st.sessions} 个会话` : '') : ''}</span><span class="d">${esc(detail)}</span></div>`;
  }).join('');
}
async function init() {
  settings = await window.atm.getSettings();
  $('org').value = settings.devinOrgId; $('base').value = settings.devinBaseUrl; $('since').value = settings.sinceHours;
  $('keyState').textContent = settings.devinKeySet ? (settings.devinKeyFromEnv ? '(使用环境变量 DEVIN_API_KEY)' : '(已保存' + (settings.keyEncrypted ? '，已加密' : '') + ')') : '(未设置)';
  $('info').textContent = `本地仪表盘: ${settings.url} · 配置文件: ${settings.configFile}`;
  renderProviders(await window.atm.providerStatus());
}
async function save(extra = {}) {
  $('msg').className = 'hint'; $('msg').textContent = '保存中…';
  const providers = [...document.querySelectorAll('#providers input[type=checkbox]')].filter((c) => c.checked).map((c) => c.dataset.id);
  try {
    const status = await window.atm.saveSettings({ providers, devinKey: $('key').value, devinOrgId: $('org').value, devinBaseUrl: $('base').value, sinceHours: $('since').value, ...extra });
    $('key').value = '';
    settings = await window.atm.getSettings();
    $('keyState').textContent = settings.devinKeySet ? '(已保存' + (settings.keyEncrypted ? '，已加密' : '') + ')' : '(未设置)';
    renderProviders(status);
    const devin = status.find((p) => p.id === 'devin-cloud');
    $('msg').className = devin && devin.state === 'error' ? 'err' : 'ok';
    $('msg').textContent = devin && devin.state === 'error' ? 'Devin 连接失败: ' + devin.detail : '已保存';
  } catch (e) { $('msg').className = 'err'; $('msg').textContent = String(e.message || e); }
}
$('save').onclick = () => save();
$('clearKey').onclick = () => save({ clearDevinKey: true });
setInterval(async () => renderProviders(await window.atm.providerStatus()), 5000);
init();
</script>
</body>
</html>
