<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Token Meter</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --yellow:#d29922; --red:#f85149; --purple:#bc8cff; --cyan:#39c5cf; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--fg); font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  #app { padding:10px 12px; background:var(--bg); border:1px solid var(--border); border-radius:10px; min-width:280px; }
  .hd { display:flex; align-items:center; gap:7px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--red); flex:none; }
  .dot.on { background:var(--green); box-shadow:0 0 5px var(--green); }
  .hd b { font-size:12px; }
  .hd .mode { color:var(--green); font-size:10px; border:1px solid var(--green); border-radius:999px; padding:0 6px; }
  .hd .mode.off { color:var(--dim); border-color:var(--border); }
  .hd .sp { flex:1; }
  .hd a { color:var(--dim); font-size:10px; text-decoration:none; }
  .hd a:hover { color:var(--accent); }
  .title { margin:8px 0 2px; }
  .title b { font-size:13px; }
  .sub { color:var(--dim); font-size:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .big { display:flex; align-items:baseline; gap:8px; margin:6px 0 2px; }
  .big .v { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
  .big .d { color:var(--green); font-variant-numeric:tabular-nums; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin:6px 0 8px; }
  .grid > div { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:3px 5px; }
  .grid .k { color:var(--dim); font-size:10px; }
  .grid .n { font-weight:600; font-variant-numeric:tabular-nums; }
  .ag { display:grid; grid-template-columns:1fr auto auto; gap:2px 8px; padding:4px 7px; border-bottom:1px solid #21262d; font-variant-numeric:tabular-nums; }
  .ag:last-child { border-bottom:none; }
  .agents { border:1px solid var(--border); border-radius:7px; overflow:hidden; }
  .ag .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .ag.child .nm { color:var(--cyan); }
  .ag .tree { color:var(--border); font-family:ui-monospace,monospace; font-weight:400; }
  .ag .tot { font-weight:600; text-align:right; }
  .ag .dl { color:var(--green); text-align:right; min-width:42px; }
  .ag .meta { grid-column:1 / -1; color:var(--dim); font-size:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ag .meta .m { color:var(--yellow); }
  .ag .meta .r { color:var(--purple); }
  .st { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--dim); margin-right:5px; vertical-align:middle; }
  .st.running { background:var(--green); animation:pulse 1.2s ease-in-out infinite; }
  .st.error { background:var(--red); } .st.aborted { background:var(--yellow); }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
  .flash { animation:flash 1.4s ease-out; }
  @keyframes flash { 0% { background:rgba(63,185,80,.4); } 100% { background:transparent; } }
  .foot { color:var(--dim); font-size:10px; margin-top:6px; display:flex; justify-content:space-between; gap:6px; }
  .empty { color:var(--dim); text-align:center; padding:24px 0; }
  .hint { color:var(--yellow); font-size:10px; margin-top:6px; }
  @media (prefers-reduced-motion: reduce) { .st.running, .flash { animation:none; } }
</style>
</head>
<body>
<div id="app">
  <div class="hd">
    <span class="dot" id="dot"></span><b>Token Meter</b><span class="mode off" id="mode">快照</span><span class="sp"></span>
    <a id="open" target="_blank" rel="noopener">仪表盘 ↗</a>
  </div>
  <div id="body"><div class="empty">加载中…</div></div>
  <div class="hint" id="hint" hidden></div>
</div>
<script>
// __API__ and __EMBED__ are substituted by the MCP server at resources/read time.
const API = '__API__';
const EMBED = __EMBED__;
const fmt = (n) => { n = n || 0; if (n >= 1e9) return (n/1e9).toFixed(2)+'B'; if (n >= 1e6) return (n/1e6).toFixed(2)+'M'; if (n >= 1e4) return (n/1e3).toFixed(1)+'k'; return n.toLocaleString('en-US'); };
const fmtCost = (c) => { if (c === null || c === undefined || Number.isNaN(c)) return '—'; if (c === 0) return '$0.00'; if (c < 0.01) return '$' + c.toFixed(4); if (c < 1) return '$' + c.toFixed(3); return '$' + c.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
const costCell = (c, priced) => (c === null || c === undefined ? '—' : priced ? fmtCost(c) : '~' + fmtCost(c));
const ago = (ts) => { if (!ts) return '-'; const s = Math.max(0, Math.round((Date.now()-ts)/1000)); return s<60?s+'s':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d'; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const base = (p) => (p || '').split(/[\\/]/).filter(Boolean).pop() || p || '';
const contains = (n, id) => n.id === id || (n.children || []).some((c) => contains(c, id));
const $ = (id) => document.getElementById(id);
const prev = new Map();
let state = null;
let wantId = null; // the session this widget was opened for

const toolOut = (typeof window !== 'undefined' && window.openai && window.openai.toolOutput) || null;
if (toolOut && toolOut.session && toolOut.session.id) wantId = toolOut.session.id;
if (!wantId && EMBED.session && EMBED.session.id) wantId = EMBED.session.id;
if (!state && toolOut && toolOut.session) state = { sessions: [toolOut.session], focus: { sessionId: toolOut.session.id } };
if (!state && EMBED.session) state = { sessions: [EMBED.session], focus: { sessionId: EMBED.session.id } };

$('open').href = API + '/';

function pick(state) {
  if (!state || !state.sessions || !state.sessions.length) return { s: null, auto: false };
  if (wantId) {
    const s = state.sessions.find((x) => contains(x, wantId));
    if (s) return { s, auto: true, followed: true };
  }
  const f = state.focus && state.sessions.find((x) => contains(x, state.focus.sessionId));
  return { s: f || state.sessions[0], auto: true, followed: !!f };
}

function agentRows(n, prefix, indent, out) {
  const before = prev.get(n.id);
  const changed = before !== undefined && before !== n.usage.total;
  prev.set(n.id, n.usage.total);
  const isMain = n.depth === 0 && !n.nickname;
  const ctx = n.contextWindow ? ` · 上下文 ${Math.min(100, Math.round(n.contextUsed / n.contextWindow * 100))}%` : '';
  out.push(`<div class="ag ${isMain ? '' : 'child'} ${changed ? 'flash' : ''}">
    <span class="nm"><span class="tree">${prefix}</span><span class="st ${n.status}"></span>${esc(isMain ? 'main' : n.name)}</span>
    <span class="dl">${n.last && n.last.total ? '+' + fmt(n.last.total) : ''}</span>
    <span class="tot">${fmt(n.usage.total)}</span>
    <span class="meta">${n.role ? `<span class="r">${esc(n.role)}</span> · ` : ''}<span class="m">${esc(n.model || '-')}</span> · in ${fmt(n.usage.input)} / out ${fmt(n.usage.output)} · ${costCell(n.cost, n.costPriced)} · ${n.requests} 次${ctx} · ${ago(n.updatedAt)}</span>
  </div>`);
  (n.children || []).forEach((c, i) => {
    const last = i === n.children.length - 1;
    agentRows(c, indent + (last ? '└ ' : '├ '), indent + (last ? '  ' : '│ '), out);
  });
}

function render() {
  if (!state) return;
  const { s, followed } = pick(state);
  if (!s) { $('body').innerHTML = '<div class="empty">还没有会话数据。</div>'; return; }
  const u = s.subtreeUsage;
  let delta = 0;
  (function walk(n) { delta += (n.last && n.last.total) || 0; (n.children || []).forEach(walk); })(s);
  const rows = [];
  agentRows(s, '', '', rows);
  const subCount = (function count(n) { return (n.children || []).reduce((a, c) => a + 1 + count(c), 0); })(s);
  $('body').innerHTML = `
    <div class="title"><b title="${esc(s.cwd || '')}">${esc(base(s.cwd) || '会话')}</b>${followed ? ' <span class="mode">跟随中</span>' : ''}</div>
    <div class="sub">会话 ${esc(s.id)}</div>
    <div class="big"><span class="v">${fmt(u.total)}</span><span class="d">${delta ? '最近 +' + fmt(delta) : ''}</span><span class="d" style="color:var(--yellow)">${costCell(s.subtreeCost, s.subtreeCostPriced)}</span></div>
    <div class="grid">
      <div><div class="k">输入</div><div class="n">${fmt(u.input)}</div></div>
      <div><div class="k">缓存</div><div class="n">${fmt(u.cached)}</div></div>
      <div><div class="k">输出</div><div class="n">${fmt(u.output)}</div></div>
      <div><div class="k">推理</div><div class="n">${fmt(u.reasoning)}</div></div>
    </div>
    <div class="agents">${rows.join('')}</div>
    <div class="foot"><span>${subCount ? `${subCount} 个子代理 ${fmt(u.total - s.usage.total)}` : '无子代理'}</span><span>${new Date().toLocaleTimeString()}</span></div>`;
}

async function poll() {
  try {
    const r = await fetch(API + '/api/state?limit=8', { cache: 'no-store' });
    if (!r.ok) throw new Error(String(r.status));
    state = await r.json();
    $('dot').classList.add('on');
    const m = $('mode');
    m.textContent = '实时';
    m.classList.remove('off');
    $('hint').hidden = true;
  } catch {
    $('dot').classList.remove('on');
    const m = $('mode');
    m.textContent = '快照';
    m.classList.add('off');
    if (state) {
      $('hint').hidden = false;
      $('hint').textContent = '无法连接仪表盘 ' + API + '，显示的是快照。运行 codex-token-meter web 可实时更新。';
    }
  }
  render();
}
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
