<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Codex Token Meter</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --yellow:#d29922; --red:#f85149; --purple:#bc8cff; --cyan:#39c5cf; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:2; }
  header h1 { font-size:17px; margin:0; }
  .live { display:inline-flex; align-items:center; gap:6px; color:var(--dim); font-size:12px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--red); }
  .dot.on { background:var(--green); box-shadow:0 0 6px var(--green); }
  header .spacer { flex:1; }
  header label { color:var(--dim); font-size:12px; display:flex; gap:6px; align-items:center; }
  main { padding:18px 22px 40px; max-width:1500px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:14px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .card .k { color:var(--dim); font-size:12px; }
  .card .v { font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:2px; }
  .card .s { color:var(--dim); font-size:12px; margin-top:2px; font-variant-numeric:tabular-nums; }
  .models { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .chip { background:var(--panel); border:1px solid var(--border); border-radius:999px; padding:3px 10px; font-size:12px; }
  .chip b { color:var(--yellow); font-weight:600; margin-right:6px; }
  .session { background:var(--panel); border:1px solid var(--border); border-radius:10px; margin-bottom:16px; overflow:hidden; }
  .session-head { display:flex; flex-wrap:wrap; gap:14px; align-items:baseline; padding:10px 14px; border-bottom:1px solid var(--border); }
  .session-head .title { font-weight:600; }
  .session-head .meta { color:var(--dim); font-size:12px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; table-layout:fixed; }
  th:nth-child(1) { width:16%; } th:nth-child(2) { width:7%; } th:nth-child(3) { width:12%; } th:nth-child(4) { width:6%; } th:nth-child(14) { width:7%; }
  th, td { padding:7px 10px; text-align:right; white-space:nowrap; border-bottom:1px solid #21262d; }
  th { color:var(--dim); font-weight:500; font-size:12px; background:#11161d; }
  th:nth-child(-n+4), td:nth-child(-n+4) { text-align:left; }
  tr:last-child td { border-bottom:none; }
  .agent { font-weight:600; }
  .agent.sub { color:var(--cyan); }
  .tree { color:var(--border); font-family:ui-monospace,monospace; white-space:pre; }
  .id { color:var(--dim); font-size:11px; margin-left:6px; font-family:ui-monospace,monospace; }
  .role { color:var(--purple); }
  .model { color:var(--yellow); }
  .st { font-size:12px; }
  .st.running { color:var(--green); } .st.done { color:var(--dim); } .st.aborted { color:var(--yellow); } .st.error { color:var(--red); } .st.idle { color:var(--dim); }
  .total { font-weight:600; }
  .flash { animation:flash 1.6s ease-out; }
  @keyframes flash { 0% { background:rgba(63,185,80,.45); } 100% { background:transparent; } }
  .delta { color:var(--green); font-size:12px; }
  .bar { height:6px; background:#21262d; border-radius:3px; overflow:hidden; width:70px; display:inline-block; vertical-align:middle; margin-left:6px; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .bar i.working {
    background-image: linear-gradient(45deg, rgba(255,255,255,.35) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.35) 50%, rgba(255,255,255,.35) 75%, transparent 75%);
    background-size: 14px 14px;
    animation: stripes .7s linear infinite;
    box-shadow: 0 0 6px var(--accent);
  }
  @keyframes stripes { to { background-position: 14px 0; } }
  .st.running { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }
  .working-badge { display:inline-flex; align-items:center; gap:6px; color:var(--green); font-size:12px; border:1px solid var(--green); border-radius:999px; padding:2px 10px; }
  .working-badge .spin { display:inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  select { background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:6px; font-size:12px; padding:2px 6px; }
  @media (prefers-reduced-motion: reduce) {
    .bar i.working, .st.running, .working-badge .spin, .flash { animation:none; }
  }
  svg.spark { vertical-align:middle; }
  .empty { color:var(--dim); text-align:center; padding:60px 0; }
  .foot { color:var(--dim); font-size:12px; padding:8px 14px; border-top:1px solid var(--border); }
  .providers { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .prov { display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:7px 12px; cursor:pointer; font-size:12px; }
  .prov.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .prov b { font-size:13px; }
  .prov .pd { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .prov.active .pd { background:var(--green); box-shadow:0 0 6px var(--green); }
  .prov.connected .pd { background:var(--accent); }
  .prov.installed .pd, .prov.connecting .pd, .prov.detecting .pd { background:var(--yellow); }
  .prov.needs-key .pd, .prov.error .pd { background:var(--red); }
  .prov.not-found { opacity:.55; }
  .prov .ps { color:var(--dim); }
  .badge { font-size:11px; border-radius:999px; padding:1px 8px; border:1px solid var(--border); color:var(--dim); }
  .badge.codex { color:#10a37f; border-color:#10a37f; } .badge.claude { color:#d97757; border-color:#d97757; }
  .badge.antigravity { color:#4285f4; border-color:#4285f4; } .badge.devin-local, .badge.devin-cloud { color:var(--purple); border-color:var(--purple); }
  .st.waiting { color:var(--yellow); }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1 id="appTitle">Codex Token Meter</h1>
  <span class="live"><span class="dot" id="dot"></span><span id="liveText">连接中…</span></span>
  <span id="working"></span>
  <span class="spacer"></span>
  <label id="provLabel" hidden>来源
    <select id="provFilter"><option value="all">全部</option></select>
  </label>
  <label>显示
    <select id="activeWindow">
      <option value="30" selected>最近 30 分钟活跃</option>
      <option value="120">最近 2 小时活跃</option>
      <option value="720">最近 12 小时活跃</option>
      <option value="1440">最近 24 小时活跃</option>
      <option value="0">全部会话</option>
    </select>
  </label>
  <span class="live" id="home"></span>
  <button id="openMini" title="打开跟随当前会话的悬浮小窗" style="background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:6px;font-size:12px;padding:3px 10px;cursor:pointer">悬浮窗</button>
</header>
<main>
  <div class="providers" id="providers" hidden></div>
  <div class="cards" id="cards"></div>
  <div class="models" id="models"></div>
  <div id="sessions"></div>
  <div class="foot" id="pricingNote"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => { n = n || 0; if (n >= 1e9) return (n/1e9).toFixed(2)+'B'; if (n >= 1e6) return (n/1e6).toFixed(2)+'M'; if (n >= 1e4) return (n/1e3).toFixed(1)+'k'; return n.toLocaleString('en-US'); };
const fmtCost = (c) => { if (c === null || c === undefined || Number.isNaN(c)) return '—'; if (c === 0) return '$0.00'; if (c < 0.01) return '$' + c.toFixed(4); if (c < 1) return '$' + c.toFixed(3); return '$' + c.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
const costCell = (c, priced) => (c === null || c === undefined ? '—' : priced ? fmtCost(c) : '~' + fmtCost(c));
const ago = (ts) => { if (!ts) return '-'; const s = Math.max(0, Math.round((Date.now()-ts)/1000)); return s<60?s+'s':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d'; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const STATUS = { running:'● 运行中', done:'✓ 完成', aborted:'■ 中断', error:'✗ 错误', idle:'○ 空闲', waiting:'◔ 等待输入' };
const PSTATE = { active:'活跃', connected:'已连接', installed:'已安装 · 无数据', 'not-found':'未发现', 'needs-key':'需要 API 密钥', error:'错误', connecting:'连接中', detecting:'检测中' };
const PNAME = { codex:'Codex', claude:'Claude Code', antigravity:'Antigravity', 'devin-local':'Devin 本地', 'devin-cloud':'Devin 云端' };
const fmtAcu = (a) => (a === null || a === undefined ? '—' : (Math.round(a * 100) / 100) + ' ACU');
const nodeCost = (n, sub) => (n.provider === 'devin-cloud' || (n.acus != null && !n.usage.total) ? fmtAcu(sub ? n.subtreeAcus : n.acus) : sub ? costCell(n.subtreeCost, n.subtreeCostPriced) : costCell(n.cost, n.costPriced));
let provFilter = localStorage.getItem('ctm.provider') || 'all';
const prevTotals = new Map();
let state = null;

function spark(history) {
  if (!history || history.length < 2) return '';
  const d = []; for (let i = 1; i < history.length; i++) d.push(history[i][1] - history[i-1][1]);
  const pts = d.slice(-24), max = Math.max(...pts, 1), w = 90, h = 20, step = w / Math.max(1, pts.length - 1);
  const path = pts.map((v, i) => `${i ? 'L' : 'M'}${(i*step).toFixed(1)},${(h - 2 - (v/max)*(h-4)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}"><path d="${path}" fill="none" stroke="#bc8cff" stroke-width="1.5"/></svg>`;
}

function card(k, v, s) { return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s || ''}</div></div>`; }

function row(n, prefix) {
  const prev = prevTotals.get(n.id);
  const changed = prev !== undefined && prev !== n.usage.total;
  prevTotals.set(n.id, n.usage.total);
  const isMain = n.depth === 0 && !n.nickname;
  const ctxPct = n.contextWindow ? Math.min(100, Math.round(n.contextUsed / n.contextWindow * 100)) : null;
  return `<tr class="${changed ? 'flash' : ''}">
    <td><span class="tree">${prefix}</span><span class="agent ${isMain ? '' : 'sub'}">${esc(isMain ? 'main' : n.name)}</span><span class="id">${esc(n.id.slice(-8))}</span></td>
    <td class="role">${esc(n.role || '-')}</td>
    <td class="model">${esc(n.model || '-')}${n.effort ? ` <span class="id">${esc(n.effort)}</span>` : ''}</td>
    <td class="st ${esc(n.status)}">${STATUS[n.status] || esc(n.status)}${n.compacted ? ' <span class="id" title="发生过上下文压缩">⤺</span>' : ''}</td>
    <td>${fmt(n.usage.input)}</td><td>${fmt(n.usage.cached)}</td><td>${fmt(n.usage.output)}</td><td>${fmt(n.usage.reasoning)}</td>
    <td class="total">${fmt(n.usage.total)}</td>
    <td class="total">${nodeCost(n)}</td>
    <td class="delta">${n.last.total ? '+' + fmt(n.last.total) : '-'}</td>
    <td>${n.requests}</td>
    <td>${ctxPct === null ? '-' : ctxPct + '%<span class="bar"><i class="' + (n.status === 'running' ? 'working' : '') + '" style="width:' + ctxPct + '%"></i></span>'}</td>
    <td>${spark(n.history)}</td>
    <td>${ago(n.updatedAt)}</td>
  </tr>`;
}

function rows(n, prefix, childIndent) {
  let html = row(n, prefix);
  n.children.forEach((k, i) => {
    const last = i === n.children.length - 1;
    html += rows(k, childIndent + (last ? '└─ ' : '├─ '), childIndent + (last ? '   ' : '│  '));
  });
  return html;
}

function renderProviders() {
  const ps = state.providers;
  $('providers').hidden = !ps; $('provLabel').hidden = !ps;
  if (!ps) return;
  document.title = 'Agent Token Meter'; $('appTitle').textContent = 'Agent Token Meter';
  if (provFilter !== 'all' && !ps.some((p) => p.id === provFilter)) provFilter = 'all';
  const sel = $('provFilter');
  const opts = '<option value="all">全部</option>' + ps.map((p) => `<option value="${esc(p.id)}">${esc(PNAME[p.id] || p.name)}</option>`).join('');
  if (sel.dataset.html !== opts) { sel.innerHTML = opts; sel.dataset.html = opts; }
  sel.value = provFilter;
  $('providers').innerHTML = ps.map((p) => {
    const tip = [p.surfaces, p.detail, ...(p.roots || []), ...(p.bins || [])].filter(Boolean).join('\n');
    const extra = [p.sessions ? p.sessions + ' 个会话' : '', (p.running || []).join(' · ')].filter(Boolean).join(' · ');
    return `<div class="prov ${esc(p.state)} ${provFilter === p.id ? 'sel' : ''}" data-id="${esc(p.id)}" title="${esc(tip)}"><span class="pd"></span><b>${esc(PNAME[p.id] || p.name)}</b><span class="ps">${esc(PSTATE[p.state] || p.state)}${extra ? ' · ' + esc(extra) : ''}${p.state === 'error' && p.detail ? ' · ' + esc(p.detail) : ''}</span></div>`;
  }).join('');
}

function render() {
  if (!state) return;
  renderProviders();
  const filter = state.providers ? provFilter : 'all';
  const T = filter !== 'all' && state.byProvider && state.byProvider[filter] ? state.byProvider[filter] : state.totals;
  let runningCount = 0;
  state.sessions.forEach(function walk(n) { if (n.status === 'running') runningCount++; n.children.forEach(walk); });
  $('working').innerHTML = runningCount
    ? `<span class="working-badge"><span class="spin">◌</span>${runningCount} 个 agent 工作中</span>`
    : '';
  $('home').textContent = state.codexHome;
  const sub = T.subagents;
  $('cards').innerHTML =
    card('全部 Token', fmt(T.all.total), `输入 ${fmt(T.all.input)} · 输出 ${fmt(T.all.output)}`) +
    card('费用约 (USD)', costCell(T.cost, T.costPriced), T.costPriced ? '按官方 API 定价估算' : '部分模型未定价') +
    (T.acus != null ? card('Devin ACU', fmtAcu(T.acus), 'Devin 按 ACU 计费') : '') +
    card('子代理 Token', `<span style="color:var(--cyan)">${fmt(sub.total)}</span>`, T.all.total ? `占 ${Math.round(sub.total / T.all.total * 100)}%` : '') +
    card('输入', fmt(T.all.input), `其中缓存 ${fmt(T.all.cached)}`) +
    card('输出', fmt(T.all.output), `其中推理 ${fmt(T.all.reasoning)}`) +
    card('子代理 输入 / 输出', `${fmt(sub.input)} / ${fmt(sub.output)}`, `缓存 ${fmt(sub.cached)} · 推理 ${fmt(sub.reasoning)} · 费用约 ${costCell(sub.cost, sub.priced)}`);
  $('models').innerHTML = Object.entries(T.byModel).sort((a, b) => b[1].total - a[1].total)
    .map(([m, u]) => `<span class="chip"><b>${esc(m)}</b>${fmt(u.total)} <span class="id">in ${fmt(u.input)} / out ${fmt(u.output)} · ${costCell(u.cost, u.priced)}</span></span>`).join('');
  $('pricingNote').textContent = state.pricing
    ? `费用为估算 (按 OpenAI / Anthropic / Google 官方 API 定价 ${state.pricing.date} 换算，以官网为准)，不是账单；“~”表示部分模型未定价。订阅制 (ChatGPT / Claude 订阅) 不按此计费。`
    : '';

  let sessions = filter === 'all' ? state.sessions : state.sessions.filter((s) => s.provider === filter);
  const mins = Number($('activeWindow').value);
  if (mins) {
    const active = sessions.filter((s) => Date.now() - s.lastActive < mins * 60 * 1000);
    sessions = active.length ? active : sessions.slice(0, 1);
  }
  if (!sessions.length) { $('sessions').innerHTML = `<div class="empty">还没有会话。${state.providers ? '运行 Codex / Claude Code / Antigravity / Devin' : '运行 codex'} 后这里会实时显示。</div>`; return; }
  $('sessions').innerHTML = sessions.map((s) => {
    const subTotal = s.subtreeUsage.total - s.usage.total;
    const count = (n) => n.children.reduce((a, c) => a + 1 + count(c), 0);
    return `<div class="session">
      <div class="session-head">${s.provider && state.providers ? `<span class="badge ${esc(s.provider)}">${esc(PNAME[s.provider] || s.provider)}</span>` : ''}<span class="title">${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.id)}</a>` : esc(s.title || s.cwd || s.id)}</span>
        <span class="meta">${s.title && s.cwd ? esc(s.cwd) + ' · ' : ''}会话 ${esc(s.id)} · ${esc(s.source)} · 开始于 ${s.startedAt ? new Date(s.startedAt).toLocaleString() : '-'}</span></div>
      <table><thead><tr><th>Agent</th><th>角色</th><th>模型</th><th>状态</th><th>输入</th><th>缓存</th><th>输出</th><th>推理</th><th>总计</th><th>费用</th><th>本次</th><th>请求</th><th>上下文</th><th>趋势</th><th>更新</th></tr></thead>
      <tbody>${rows(s, '', '')}</tbody></table>
      ${s.children.length ? `<div class="foot">${count(s)} 个子代理共 ${fmt(subTotal)} tokens · 会话合计 ${fmt(s.subtreeUsage.total)} tokens · 费用约 ${nodeCost(s, true)}</div>` : `<div class="foot">会话费用约 ${nodeCost(s, true)}</div>`}
    </div>`;
  }).join('');
}

function connect() {
  const es = new EventSource('/api/events');
  es.onopen = () => { $('dot').classList.add('on'); $('liveText').textContent = '实时'; };
  es.onmessage = (e) => { state = JSON.parse(e.data); render(); };
  es.onerror = () => { $('dot').classList.remove('on'); $('liveText').textContent = '已断开，重连中…'; };
}
const winSel = $('activeWindow');
winSel.value = localStorage.getItem('ctm.activeWindow') ?? '30';
if (!winSel.value) winSel.value = '30';
winSel.onchange = () => { localStorage.setItem('ctm.activeWindow', winSel.value); render(); };
setInterval(() => { if (state) { prevTotals.clear(); state.sessions.forEach(function walk(n) { prevTotals.set(n.id, n.usage.total); n.children.forEach(walk); }); render(); } }, 5000);
$('provFilter').onchange = (e) => { provFilter = e.target.value; localStorage.setItem('ctm.provider', provFilter); render(); };
$('providers').onclick = (e) => { const el = e.target.closest('.prov'); if (!el) return; provFilter = provFilter === el.dataset.id ? 'all' : el.dataset.id; localStorage.setItem('ctm.provider', provFilter); render(); };
$('openMini').onclick = () => window.open('/mini', 'ctm-mini', 'popup,width=380,height=560');
connect();
</script>
</body>
</html>
